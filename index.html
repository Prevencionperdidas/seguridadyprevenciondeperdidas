<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seguridad y Prevención de Pérdidas</title>
<meta name="theme-color" content="#0058A3">
<style>
:root{
  --azul:#0058A3; --azul-osc:#00417a; --azul-noche:#0a2a5c; --amarillo:#FFDB00;
  --fondo:#eef2f8; --panel:#fff; --texto:#0e2347; --suave:#5b6b80; --borde:#e2e8f1;
  --top-h:84px; --foot-h:46px; --side-w:360px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Noto Sans","Segoe UI",Roboto,Arial,sans-serif;background:var(--fondo);color:var(--texto);overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit}

/* ================= Encabezado ================= */
.top{height:var(--top-h);flex-shrink:0;background:linear-gradient(90deg,var(--azul-noche) 0%,var(--azul) 55%,var(--azul-osc) 100%);color:#fff;display:flex;align-items:center;gap:18px;padding:0 22px;position:relative;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.burger{display:none;font-size:24px;width:40px;height:40px;border-radius:8px}
.burger:hover{background:rgba(255,255,255,.12)}
.logo-emp{height:50px;max-width:150px;object-fit:contain}
.sep{width:2px;height:48px;background:rgba(255,255,255,.55);border-radius:2px}
.escudo{width:52px;height:52px;object-fit:contain}
.titulo{min-width:0}
.titulo b{display:block;font-size:24px;font-weight:800;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titulo span{display:block;font-size:16px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.nav{display:flex;gap:6px;height:100%}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 18px;font-size:15px;position:relative;opacity:.92}
.nav button .i{font-size:24px;line-height:1}
.nav button:hover{opacity:1;background:rgba(255,255,255,.06)}
.nav button.act{opacity:1}
.nav button.act::after{content:"";position:absolute;left:16px;right:16px;bottom:14px;height:3px;border-radius:2px;background:var(--amarillo)}
.nav button.act .i{color:var(--amarillo)}
.nav button.admin-on{color:var(--amarillo);font-weight:700}
.usuario{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:10px;text-align:left}
.usuario:hover{background:rgba(255,255,255,.08)}
.avatar{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--azul);display:grid;place-items:center;font-weight:800;font-size:16px;flex-shrink:0}
.usuario b{display:block;font-size:15px;white-space:nowrap}
.usuario small{display:block;font-size:13px;opacity:.9;white-space:nowrap}

/* ================= Cuerpo ================= */
.cuerpo{flex:1;display:flex;gap:14px;padding:14px;min-height:0}

/* ---- Menú lateral ---- */
aside{width:var(--side-w);flex-shrink:0;display:flex;flex-direction:column;background:var(--panel);border-radius:14px;box-shadow:0 4px 16px rgba(10,42,92,.08);overflow:hidden;z-index:20}
.side-h{display:flex;align-items:center;gap:12px;background:var(--amarillo);color:var(--azul-noche);padding:16px 18px;font-size:20px;font-weight:800;width:100%;text-align:left}
.side-h .grid-ic{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:26px;height:26px}
.side-h .grid-ic i{background:var(--azul-noche);border-radius:3px}
.side-h .chev{margin-left:auto;font-size:16px;transition:transform .2s}
aside.plegado .side-h .chev{transform:rotate(-90deg)}
aside.plegado .side-body{display:none}
.side-body{flex:1;display:flex;flex-direction:column;min-height:0}
.buscar{position:relative;margin:12px 14px 4px}
.buscar input{width:100%;padding:10px 54px 10px 36px;border-radius:10px;border:1px solid var(--borde);background:#f6f8fb;color:var(--texto);outline:none;font-size:14px}
.buscar input:focus{border-color:var(--azul);background:#fff;box-shadow:0 0 0 3px rgba(0,88,163,.12)}
.buscar::before{content:"⌕";position:absolute;left:12px;top:50%;transform:translateY(-54%);font-size:18px;color:#8a98ab}
.kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:10.5px;color:#8a98ab;border:1px solid var(--borde);padding:1px 5px;border-radius:4px;background:#fff}
.menu{flex:1;overflow-y:auto;padding:4px 10px 10px;scrollbar-width:thin}
.menu-msg{padding:18px 10px;color:var(--suave);font-size:14px;line-height:1.5}
.cat{margin-top:6px}
.cat-h{display:flex;align-items:center;gap:6px;padding:8px 8px 4px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#8a98ab;font-weight:700;user-select:none;cursor:pointer}
.cat-h:hover{color:var(--azul)}
.cat-h .flecha{transition:transform .2s;font-size:9px;width:10px}
.cat-h .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat.cerrada .flecha{transform:rotate(-90deg)}
.cat.cerrada .cat-b{display:none}
.cat-h .n{margin-left:auto;background:#eef2f8;border-radius:10px;padding:0 7px;font-size:10.5px}
.sin-cats .cat-h{display:none}
.cat-b{min-height:6px;border-radius:8px}
.cat-b.over{outline:2px dashed var(--amarillo);outline-offset:2px}
.item{display:flex;align-items:center;gap:14px;padding:12px 10px;border-bottom:1px solid var(--borde);cursor:pointer;border-radius:8px;position:relative}
.item:last-child{border-bottom-color:transparent}
.item:hover{background:#f4f7fc}
.item.act{background:#fff8d6;box-shadow:inset 4px 0 0 var(--amarillo)}
.item .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;flex-shrink:0}
.item .tx{flex:1;min-width:0}
.item .nm{display:block;font-weight:700;font-size:15.5px;color:var(--texto);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .ds{display:block;font-size:13px;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.item .chev{font-size:22px;color:#7d8da4;flex-shrink:0;line-height:1}
.item.oculta{opacity:.45}
.item.oculta .nm::after{content:" (oculta)";font-weight:400;font-size:12px}
.item.over{box-shadow:inset 0 3px 0 var(--amarillo)}
.item.drag{opacity:.35}
body.admin .item{cursor:grab}
.adm{display:none;gap:1px;flex-shrink:0}
body.admin .adm{display:flex}
body.admin .item .chev{display:none}
.adm button{width:26px;height:26px;border-radius:6px;font-size:13px;color:#5b6b80;text-transform:none;letter-spacing:0}
.adm button:hover{background:#e3e9f2;color:var(--azul)}
.side-foot{padding:12px 14px;border-top:1px solid var(--borde);display:none;gap:8px}
body.admin .side-foot{display:flex}
.side-foot .btn{flex:1}

/* ---- Botones ---- */
.btn{padding:10px 14px;border-radius:9px;font-weight:700;font-size:14px}
.btn-y{background:var(--amarillo);color:var(--azul-noche)}
.btn-y:hover{filter:brightness(.96)}
.btn-b{background:var(--azul);color:#fff}
.btn-b:hover{background:var(--azul-osc)}
.btn-l{background:#eef2f7;color:var(--texto)}
.btn-l:hover{background:#dde5ef}
.btn-r{background:#fde8e8;color:#b42318}
.btn-r:hover{background:#fbd5d5}

/* ---- Zona principal ---- */
main{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0}
.banner{flex-shrink:0;height:200px;border-radius:14px;position:relative;overflow:hidden;color:#fff;
  background:var(--banner-img, linear-gradient(120deg,#0a2a5c 0%,#0058A3 60%,#2a7bc4 100%)) center/cover no-repeat;
  box-shadow:0 4px 16px rgba(10,42,92,.12);transition:height .25s}
.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,26,60,.95) 0%,rgba(6,26,60,.82) 40%,rgba(6,26,60,.15) 75%,rgba(6,26,60,0) 100%)}
.banner .bt{position:relative;z-index:1;padding:30px 34px;max-width:780px}
.banner h1{font-size:38px;font-weight:800;line-height:1.15;transition:font-size .25s}
.banner h1 em{font-style:normal;color:var(--amarillo)}
.banner p{margin-top:18px;font-size:19px;line-height:1.4;border-left:4px solid var(--amarillo);padding-left:16px;opacity:.95}
.banner.compacto{height:64px}
.banner.compacto .bt{padding:14px 24px}
.banner.compacto h1{font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner.compacto p{display:none}

.trabajo{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel);border-radius:14px;box-shadow:0 4px 16px rgba(10,42,92,.08);overflow:hidden}
.tabs{display:flex;align-items:flex-end;gap:4px;padding:8px 10px 0;background:#e6ecf4;overflow-x:auto;flex-shrink:0;scrollbar-width:thin}
.tabs:empty{display:none}
.tab{display:flex;align-items:center;gap:7px;padding:8px 8px 9px 12px;border-radius:10px 10px 0 0;background:#d3dce8;font-size:13px;white-space:nowrap;cursor:pointer;max-width:230px;color:#2c3d55;flex-shrink:0}
.tab:hover{background:#dbe3ee}
.tab .t{overflow:hidden;text-overflow:ellipsis}
.tab.act{background:var(--panel);color:var(--texto);font-weight:700}
.tab .x{width:20px;height:20px;border-radius:5px;font-size:13px;line-height:20px;text-align:center;opacity:.55}
.tab .x:hover{background:#e3e9f1;opacity:1}
.tools{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--borde);font-size:13px;flex-shrink:0}
.tools[hidden]{display:none}
.tools .nombre{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.tools button{padding:6px 10px;border-radius:7px;background:#eef2f7;font-size:12.5px;white-space:nowrap}
.tools button:hover{background:#dde5ef}
.tools .solo-admin{display:none}
body.admin .tools .solo-admin{display:inline-block}
.vistas{flex:1;position:relative;overflow:hidden}
.vistas iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
.vistas iframe.act{display:block}
.vacio{position:absolute;inset:16px;border:2px dashed #cfd9e6;border-radius:12px;display:grid;place-items:center;text-align:center;color:var(--suave);padding:20px;background:#fafbfd}
.vacio .big{font-size:46px;opacity:.85}
.vacio h3{color:var(--texto);margin:10px 0 6px;font-size:19px}
.vacio p{font-size:14.5px;line-height:1.5;max-width:420px}
.cargando{position:absolute;inset:0;display:none;place-items:center;background:rgba(255,255,255,.9);z-index:2;color:var(--suave);font-size:14px;text-align:center}
.cargando.on{display:grid}
.spin{width:36px;height:36px;border:4px solid #d7e2f0;border-top-color:var(--azul);border-radius:50%;animation:g 1s linear infinite;margin:0 auto 10px}
@keyframes g{to{transform:rotate(360deg)}}

/* ================= Pie ================= */
.pie{height:var(--foot-h);flex-shrink:0;background:linear-gradient(90deg,var(--azul-noche),var(--azul));color:#fff;display:flex;align-items:center;gap:18px;padding:0 22px;font-size:14px}
.estado{display:flex;align-items:center;gap:8px;white-space:nowrap;padding:4px 8px;border-radius:8px}
.estado:hover{background:rgba(255,255,255,.08)}
.dot{width:12px;height:12px;border-radius:50%;background:#9aa7b8;flex-shrink:0}
.estado.ok .dot{background:#3ddc84;box-shadow:0 0 0 3px rgba(61,220,132,.25)}
.estado.cache .dot{background:#ffb020}
.estado.err .dot{background:#ff5a5a}
.pie .bar{opacity:.5}
.lema{flex:1;display:flex;align-items:center;gap:18px;justify-content:center;font-style:italic;font-weight:700;font-size:17px;white-space:nowrap;min-width:0}
.lema::before,.lema::after{content:"";flex:1;max-width:200px;height:2px;background:var(--amarillo);border-radius:2px}
.pie-der{display:flex;align-items:center;gap:12px;font-weight:800;font-size:17px;white-space:nowrap}
.pie-der img{height:32px;max-width:110px;object-fit:contain}

/* ================= Diálogos ================= */
dialog{border:none;border-radius:16px;padding:0;width:min(540px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.3);color:var(--texto);margin:auto}
dialog::backdrop{background:rgba(10,34,64,.55)}
.dh{padding:16px 20px;background:var(--azul);color:#fff;font-weight:700;border-bottom:3px solid var(--amarillo)}
.db{padding:18px 20px;display:flex;flex-direction:column;gap:14px;max-height:68vh;overflow-y:auto}
.df{padding:14px 20px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--borde);flex-wrap:wrap}
.df .izq{margin-right:auto}
.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.f input[type=text],.f input[type=url],.f input[type=password],.f select{padding:10px 12px;border:1px solid #d3dbe6;border-radius:9px;font-weight:400;outline:none;background:#fff;color:var(--texto);width:100%}
.f input:focus,.f select:focus{border-color:var(--azul);box-shadow:0 0 0 3px rgba(0,88,163,.15)}
.fila{display:flex;gap:12px;align-items:flex-end}
.fila>*{flex:1;min-width:0}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.picks button{width:36px;height:36px;border-radius:8px;background:#eef2f7;font-size:18px}
.picks button:hover{background:#dde5ef}
.sw{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #d3dbe6}
.sw button.sel{box-shadow:0 0 0 2px var(--texto)}
.sw input[type=color]{width:36px;height:30px;border:none;background:none;padding:0;cursor:pointer}
.radios{display:flex;flex-direction:column;gap:8px;font-weight:400}
.radios label,.chk{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer;font-weight:400}
.radios input,.chk input{margin-top:3px}
.ayuda{font-size:12px;color:var(--suave);font-weight:400}
.prev{display:flex;align-items:center;gap:12px;padding:12px;border:1px dashed #d3dbe6;border-radius:12px;background:#f7f9fc}
.prev .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;flex-shrink:0}
.pin-in{font-size:22px!important;letter-spacing:8px;text-align:center}
.error-txt{color:#b42318;font-size:13px;min-height:18px;font-weight:400}

.toast{position:fixed;left:50%;bottom:64px;transform:translate(-50%,160px);background:var(--azul-noche);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:100;transition:transform .25s;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw}
.toast.on{transform:translate(-50%,0)}
.toast.err{background:#b42318}
.velo{display:none}

/* ================= Pantallas medianas ================= */
@media (max-width:1280px){
  :root{--side-w:310px}
  .usuario div{display:none}
  .nav button{padding:0 12px}
  .titulo b{font-size:20px}
  .titulo span{font-size:14px}
  .banner h1{font-size:30px}
  .banner p{font-size:16px}
  .lema::before,.lema::after{display:none}
}
/* ================= Celular / Zebra ================= */
@media (max-width:900px){
  :root{--top-h:64px;--foot-h:40px}
  .top{gap:10px;padding:0 10px}
  .burger{display:block}
  .logo-emp,.sep,.titulo span,.nav button span:not(.i),.usuario div{display:none}
  .escudo{width:40px;height:40px}
  .titulo b{font-size:16px}
  .nav button{padding:0 10px}
  .nav button.act::after{bottom:8px}
  .cuerpo{padding:10px;gap:10px}
  aside{position:fixed;top:var(--top-h);bottom:0;left:0;border-radius:0;transform:translateX(-100%);transition:transform .25s;width:min(330px,88vw)!important}
  body.drawer aside{transform:none;box-shadow:10px 0 30px rgba(0,0,0,.3)}
  body.drawer .velo{display:block;position:fixed;top:var(--top-h);left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:15}
  .banner{height:auto}
  .banner .bt{padding:16px 18px}
  .banner h1{font-size:21px}
  .banner p{font-size:13.5px;margin-top:10px}
  .banner p br{display:none}
  .banner.compacto{display:none}
  .tools .opc{display:none}
  .pie{padding:0 12px;font-size:12px;gap:10px}
  .pie .bar,.pie #ultima,.lema{display:none}
  .pie-der{margin-left:auto;font-size:14px}
}
</style>
</head>
<body>

<header class="top">
  <button class="burger" id="burger" aria-label="Menú">☰</button>
  <img class="logo-emp" id="logoEmp" alt="" hidden>
  <span class="sep" id="sepLogo" hidden></span>
  <img class="escudo" id="escudo" alt="PPS">
  <div class="titulo"><b id="txtTitulo"></b><span id="txtSub"></span></div>
  <div class="spacer"></div>
  <nav class="nav">
    <button id="navInicio" class="act"><span class="i">🏠</span><span>Inicio</span></button>
    <button id="navConfig"><span class="i">⚙️</span><span id="navConfigTxt">Configuración</span></button>
  </nav>
  <span class="sep"></span>
  <button class="usuario" id="usuario" title="Cambiar nombre">
    <span class="avatar" id="avatar">PPS</span>
    <div><b id="usrNombre"></b><small id="usrCargo"></small></div>
  </button>
</header>

<div class="cuerpo">
  <aside id="aside">
    <button class="side-h" id="sideH"><span class="grid-ic"><i></i><i></i><i></i><i></i></span>Nuestras Aplicaciones<span class="chev">⌄</span></button>
    <div class="side-body">
      <div class="buscar"><input id="buscar" placeholder="Buscar aplicación…" autocomplete="off"><span class="kbd">Ctrl K</span></div>
      <nav class="menu" id="menu"></nav>
      <div class="side-foot">
        <button class="btn btn-y" id="btnNuevaApp">＋ Agregar app</button>
        <button class="btn btn-l" id="btnNuevaCat">＋ Categoría</button>
      </div>
    </div>
  </aside>
  <div class="velo" id="velo"></div>

  <main>
    <section class="banner" id="banner">
      <div class="bt">
        <h1 id="txtBanner"></h1>
        <p id="txtBannerSub"></p>
      </div>
    </section>

    <section class="trabajo">
      <div class="tabs" id="tabs"></div>
      <div class="tools" id="tools" hidden>
        <span class="nombre" id="toolsNombre"></span>
        <button id="tRecargar" title="Recargar la app">⟳ Recargar</button>
        <button id="tExterna" title="Abrir en una pestaña nueva del navegador">↗ Pestaña nueva</button>
        <button id="tFull" class="opc" title="Pantalla completa">⛶ Pantalla completa</button>
        <button id="tEditar" class="solo-admin">✎ Editar</button>
      </div>
      <div class="vistas" id="vistas">
        <div class="vacio" id="vacio"></div>
        <div class="cargando" id="cargando"><div><div class="spin"></div>Cargando aplicación…<br><span class="ayuda">Si no carga, usa “↗ Pestaña nueva”.</span></div></div>
      </div>
    </section>
  </main>
</div>

<footer class="pie">
  <button class="estado" id="estado" title="Pulsa para actualizar"><i class="dot"></i><span id="estadoTxt">Iniciando…</span></button>
  <span class="bar">|</span>
  <span id="ultima">Última actualización: —</span>
  <div class="lema" id="txtLema"></div>
  <div class="pie-der"><img id="logoPie" alt="" hidden><span id="txtPie"></span></div>
</footer>

<!-- Agregar / editar app -->
<dialog id="dlgApp">
  <form id="fApp">
    <div class="dh" id="dlgAppT">Agregar aplicación</div>
    <div class="db">
      <div class="prev"><span class="ic" id="pvIc">📱</span><div><b id="pvNm">Nombre de la app</b><div class="ayuda" id="pvDs"></div></div></div>
      <label class="f">Nombre *<input type="text" id="fNombre" maxlength="40" required></label>
      <label class="f">Descripción corta <span class="ayuda">Aparece bajo el nombre en el menú.</span><input type="text" id="fDesc" maxlength="60" placeholder="Ej: Control y trazabilidad de repites"></label>
      <label class="f">Link de la aplicación *<input type="url" id="fUrl" placeholder="https://…" required></label>
      <div class="fila">
        <label class="f">Categoría<select id="fCat"></select></label>
        <label class="f" id="wNuevaCat" hidden>Nueva categoría<input type="text" id="fNuevaCat" maxlength="30" placeholder="Ej: Aduana"></label>
      </div>
      <div class="f"><span>Ícono</span>
        <div class="fila" style="align-items:center"><input type="text" id="fIcono" maxlength="8" style="max-width:76px;text-align:center;font-size:20px;padding:6px"><span class="ayuda">Escribe un emoji o elige uno:</span></div>
        <div class="picks" id="picks"></div>
      </div>
      <div class="f"><span>Color</span><div class="sw" id="sw"></div></div>
      <div class="f"><span>¿Cómo se abre?</span>
        <div class="radios">
          <label><input type="radio" name="modo" value="portal" checked><span>Dentro del portal <span class="ayuda">(recomendado)</span></span></label>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONFIGURACIÓN — lo único que necesitas editar
   ========================================================= */
const CONFIG = {
  // URL de la implementación del Apps Script (termina en /exec).
  // Vacía = "modo local" (solo este navegador), útil para probar.
  API_URL: '',
  PIN: '358097',

  // Imágenes: pega un data:image/...;base64,... o un link https.
  LOGO_EMPRESA: '',   // logo de la empresa (izquierda del encabezado y pie)
  ESCUDO_PPS: '',     // escudo PPS (vacío = escudo genérico)
  BANNER: '',         // foto del CD para el banner (vacío = degradado azul)

  // Textos
  TITULO: 'Seguridad y Prevención de Pérdidas',
  SUBTITULO: 'Juntos por un almacén más seguro',
  BANNER_TITULO: '<em>Seguridad,</em> un compromiso de todos',
  BANNER_TEXTO: 'Prevenimos riesgos, protegemos nuestros activos<br>y cuidamos a nuestro equipo.',
  LEMA: 'Trabajamos seguros, llegamos más lejos',
  PIE: 'IKEA Chile',
  USUARIO_DEFECTO: { nombre: 'Equipo PPS', cargo: 'CD Chile' }
};

/* ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const SIN_CAT = 'General';
const COLORES = ['#0058A3','#FFDB00','#0a8f5a','#d9480f','#c2255c','#6741d9','#1098ad','#495057'];
const EMOJIS = ['🛡️','🚚','🚛','📦','🛃','🚧','🎥','📹','🔐','🪪','👮','👥','📋','📝','✅','⚠️','🚨','🧾','🏷️','📊','📈','🗂️','🕒','📅','🏭','🅿️','🔍','🦺','📸','🔖','🧰','⚙️'];

const LS = {
  get(k, d){ try{ const v = localStorage.getItem('ppsPortal.'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('ppsPortal.'+k, JSON.stringify(v)); }catch(e){} }
};
const SS = {
  get(k){ try{ return sessionStorage.getItem('ppsPortal.'+k); }catch(e){ return null; } },
  set(k, v){ try{ v == null ? sessionStorage.removeItem('ppsPortal.'+k) : sessionStorage.setItem('ppsPortal.'+k, v); }catch(e){} }
};

const S = { apps: [], categorias: [], abiertas: [], activa: null, admin: false, pin: '', filtro: '' };
let cerradas = new Set(LS.get('cerradas', []));

function colorOk(c){ return /^#[0-9a-f]{6}$/i.test(c || '') ? c : '#0058A3'; }
function hexA(hex, a){ hex = colorOk(hex); const n = parseInt(hex.slice(1), 16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
function normApp(a){
  return {
    id: String(a.id), nombre: String(a.nombre || ''), url: String(a.url || ''),
    icono: String(a.icono || '📱'), color: colorOk(a.color),
    categoria: String(a.categoria || SIN_CAT), orden: Number(a.orden) || 0,
    activa: !(a.activa === false || String(a.activa).toUpperCase() === 'FALSE'),
    modo: a.modo === 'pestana' ? 'pestana' : 'portal',
    descripcion: String(a.descripcion || '')
  };
}
const getApp = id => S.apps.find(a => a.id === id);
const genId = () => 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function catsOrdenadas(){
  const cats = [...S.categorias];
  S.apps.forEach(a => { if(!cats.includes(a.categoria)) cats.push(a.categoria); });
  return cats;
}
const appsTodasDe = cat => S.apps.filter(a => a.categoria === cat).sort((x, y) => x.orden - y.orden);
const appsDe = cat => appsTodasDe(cat).filter(a => S.admin || a.activa);
function persistirCache(){ LS.set('datos', { apps: S.apps, categorias: S.categorias, ts: Date.now() }); }

/* ---------- Comunicación con Apps Script (JSONP) ---------- */
let jsonpN = 0;
function jsonp(params, timeout = 20000){
  return new Promise((res, rej) => {
    const cb = '__pps' + Date.now() + '_' + (jsonpN++);
    const s = document.createElement('script');
    const fin = () => { clearTimeout(t); window[cb] = () => {}; s.remove(); };
    const t = setTimeout(() => { fin(); rej(new Error('Sin respuesta del servidor')); }, timeout);
    window[cb] = d => { fin(); res(d); };
    const q = new URLSearchParams({ ...params, callback: cb, _: Date.now() });
    s.src = CONFIG.API_URL + (CONFIG.API_URL.includes('?') ? '&' : '?') + q.toString();
    s.onerror = () => { fin(); rej(new Error('No se pudo conectar')); };
    document.head.appendChild(s);
  });
}

function setSync(clase, txt){
  $('#estado').className = 'estado ' + (clase || '');
  $('#estadoTxt').textContent = txt;
}
function marcarActualizado(ts){
  if(!ts) return;
  const d = new Date(ts);
  const f = d.toLocaleDateString('es-CL', { day: '2-digit', month: '2-digit', year: 'numeric' });
  const h = d.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
  $('#ultima').textContent = `Última actualización: ${f} - ${h}`;
}

async function cargar(){
  if(!CONFIG.API_URL){ setSync('cache', 'Modo local'); return; }
  setSync(S.apps.length ? 'cache' : '', S.apps.length ? 'Actualizando…' : 'Conectando…');
  try{
    const r = await jsonp({ accion: 'listar' });
    if(!r.ok) throw new Error(r.error || 'Error');
    aplicarDatos(r); setSync('ok', 'Sistema en línea');
  }catch(e){
    setSync(S.apps.length ? 'cache' : 'err', S.apps.length ? 'Sin conexión · copia local' : 'Sin conexión');
  }
}

function aplicarDatos(r){
  S.apps = (r.apps || []).map(normApp);
  S.categorias = (r.categorias || []).map(String);
  persistirCache(); marcarActualizado(Date.now());
  S.abiertas.filter(id => !getApp(id)).forEach(id => { const f = frame(id); if(f) f.remove(); });
  S.abiertas = S.abiertas.filter(id => getApp(id));
  if(S.activa && !getApp(S.activa)) activar(null); else renderTodo();
}

// Aplica el cambio localmente al instante y luego lo envía al servidor.
async function guardar(accion, params){
  persistirCache(); renderTodo();
  if(!CONFIG.API_URL){ marcarActualizado(Date.now()); toast('Guardado (modo local)'); return true; }
  setSync('cache', 'Guardando…');
  try{
    const r = await jsonp({ accion, pin: S.pin, ...params });
    if(!r.ok) throw new Error(r.error || 'Error del servidor');
    aplicarDatos(r); setSync('ok', 'Sistema en línea'); toast('Cambios guardados ✔');
    return true;
  }catch(err){
    toast('No se pudo guardar: ' + err.message, true);
    setSync('err', 'Error al guardar');
    cargar();
    return false;
  }
}

/* ---------- Render ---------- */
function itemHTML(a){
  return `<div class="item${a.id === S.activa ? ' act' : ''}${a.activa ? '' : ' oculta'}" data-id="${esc(a.id)}" draggable="${S.admin}" title="${esc(a.nombre)}">
    <span class="ic" style="background:${hexA(a.color, .14)}">${esc(a.icono)}</span>
    <span class="tx"><span class="nm">${esc(a.nombre)}${a.modo === 'pestana' ? ' ↗' : ''}</span>${a.descripcion ? `<span class="ds">${esc(a.descripcion)}</span>` : ''}</span>
    <span class="adm"><button data-mov="-1" title="Subir">↑</button><button data-mov="1" title="Bajar">↓</button><button data-edit title="Editar">✎</button></span>
    <span class="chev">›</span>
  </div>`;
}

function renderMenu(){
  const f = norm(S.filtro);
  const cats = catsOrdenadas();
  let html = '';
  cats.forEach(cat => {
    let apps = appsDe(cat);
    if(f) apps = apps.filter(a => norm(a.nombre + ' ' + a.descripcion + ' ' + cat).includes(f));
    if(!apps.length && (f || !S.admin)) return;
    const cerrada = !f && cerradas.has(cat);
    html += `<div class="cat${cerrada ? ' cerrada' : ''}" data-cat="${esc(cat)}">
      <div class="cat-h"><span class="flecha">▼</span><span class="tt">${esc(cat)}</span>
        <span class="adm"><button data-cmov="-1" title="Subir categoría">↑</button><button data-cmov="1" title="Bajar categoría">↓</button><button data-cren title="Renombrar">✎</button>${apps.length ? '' : '<button data-cdel title="Eliminar categoría vacía">🗑</button>'}</span>
        <span class="n">${apps.length}</span></div>
      <div class="cat-b">${apps.map(itemHTML).join('')}</div>
    </div>`;
  });
  if(!html){
    html = f ? `<div class="menu-msg">Sin resultados para “${esc(S.filtro)}”.</div>`
             : `<div class="menu-msg">Aún no hay aplicaciones.${S.admin ? ' Pulsa <b>＋ Agregar app</b> abajo.' : ' Entra a <b>Configuración</b> para crear la primera.'}</div>`;
  }
  const menu = $('#menu');
  menu.innerHTML = html;
  // Con una sola categoría (y fuera de admin) no se muestran los títulos de categoría
  menu.classList.toggle('sin-cats', !S.admin && cats.filter(c => appsDe(c).length).length <= 1);
}

function renderTabs(){
  if(!S.abiertas.length){ $('#tabs').innerHTML = ''; return; }
  let html = `<div class="tab${S.activa ? '' : ' act'}" data-tab=""><span class="t">🏠 Inicio</span></div>`;
  S.abiertas.forEach(id => {
    const a = getApp(id); if(!a) return;
    html += `<div class="tab${id === S.activa ? ' act' : ''}" data-tab="${esc(id)}" title="${esc(a.nombre)}"><span>${esc(a.icono)}</span><span class="t">${esc(a.nombre)}</span><span class="x" data-cerrar="${esc(id)}" title="Cerrar">✕</span></div>`;
  });
  $('#tabs').innerHTML = html;
  const act = $('#tabs .tab.act'); if(act) act.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

function renderTools(){
  const a = S.activa && getApp(S.activa);
  $('#tools').hidden = !a;
  if(a) $('#toolsNombre').textContent = a.icono + '  ' + a.nombre;
}

function renderVacio(){
  const hay = S.apps.some(a => a.activa);
  $('#vacio').innerHTML = hay
    ? `<div><div class="big">👈</div><h3>Selecciona una aplicación</h3><p>Elige una app del menú <b>Nuestras Aplicaciones</b> y se abrirá aquí. Puedes tener varias abiertas a la vez en pestañas.</p></div>`
    : `<div><div class="big">🧩</div><h3>Aún no hay aplicaciones</h3><p>Entra a <b>Configuración</b> con tu PIN y pulsa <b>＋ Agregar app</b> para crear el primer botón.</p></div>`;
}

function renderTodo(){ renderMenu(); renderTabs(); renderTools(); renderVacio(); }

/* ---------- Abrir apps / pestañas ---------- */
const frame = id => [...document.querySelectorAll('#vistas iframe')].find(f => f.dataset.id === id);
let cargaTimer = null;
function cargando(on){
  $('#cargando').classList.toggle('on', on);
  clearTimeout(cargaTimer);
  if(on) cargaTimer = setTimeout(() => $('#cargando').classList.remove('on'), 15000);
}

function abrirApp(id){
  const a = getApp(id); if(!a) return;
  cerrarDrawer();
  if(a.modo === 'pestana'){ window.open(a.url, '_blank', 'noopener'); return; }
  if(!S.abiertas.includes(id)) S.abiertas.push(id);
  activar(id);
}

function activar(id){
  S.activa = id || null;
  $('#vacio').style.display = S.activa ? 'none' : 'grid';
  $('#banner').classList.toggle('compacto', !!S.activa);
  $('#navInicio').classList.toggle('act', !S.activa);
  document.querySelectorAll('#vistas iframe').forEach(f => f.classList.toggle('act', f.dataset.id === S.activa));
  if(S.activa){
    const a = getApp(S.activa);
    let f = frame(S.activa);
    if(!f){
      f = document.createElement('iframe');
      f.dataset.id = S.activa;
      f.allow = 'camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen';
      f.setAttribute('allowfullscreen', '');
      const fid = S.activa;
      f.onload = () => { f.dataset.ok = '1'; if(S.activa === fid) cargando(false); };
      f.src = a.url;
      f.classList.add('act');
      $('#vistas').appendChild(f);
    }
    cargando(!f.dataset.ok);
    document.title = a.nombre + ' · ' + CONFIG.TITULO;
  }else{
    cargando(false);
    document.title = CONFIG.TITULO;
  }
  renderTabs(); renderTools(); renderMenu();
}

function cerrarTab(id){
  const i = S.abiertas.indexOf(id);
  if(i < 0) return;
  S.abiertas.splice(i, 1);
  const f = frame(id); if(f) f.remove();
  if(S.activa === id) activar(S.abiertas[i] || S.abiertas[i - 1] || null);
  else renderTabs();
}

/* ---------- Administración ---------- */
function setAdmin(on, pin){
  S.admin = on; S.pin = on ? pin : '';
  SS.set('pin', on ? pin : null);
  document.body.classList.toggle('admin', on);
  $('#navConfig').classList.toggle('admin-on', on);
  $('#navConfigTxt').textContent = on ? 'Salir de config.' : 'Configuración';
  if(on) $('#aside').classList.remove('plegado');
  renderTodo();
}

function moverApp(id, dir){
  const a = getApp(id); const lista = appsTodasDe(a.categoria);
  const i = lista.findIndex(x => x.id === id), j = i + dir;
  if(j < 0 || j >= lista.length) return;
  [lista[i], lista[j]] = [lista[j], lista[i]];
  guardarOrden(lista);
}
function guardarOrden(...listas){
  const cambios = [];
  listas.forEach(l => l.forEach((a, i) => { a.orden = i + 1; cambios.push({ id: a.id, categoria: a.categoria, orden: i + 1 }); }));
  guardar('ordenar', { orden: JSON.stringify(cambios) });
}
function reubicar(id, cat, antesDe){
  const app = getApp(id); if(!app) return;
  const origen = app.categoria;
  const lista = appsTodasDe(cat).filter(a => a.id !== id);
  let idx = antesDe ? lista.findIndex(a => a.id === antesDe) : lista.length;
  if(idx < 0) idx = lista.length;
  lista.splice(idx, 0, app);
  app.categoria = cat;
  if(origen !== cat) guardarOrden(lista, appsTodasDe(origen));
  else guardarOrden(lista);
}

function guardarCategorias(){ guardar('guardarCategorias', { categorias: JSON.stringify(S.categorias) }); }
function nuevaCategoria(){
  const n = (prompt('Nombre de la nueva categoría:') || '').trim();
  if(!n) return;
  if(catsOrdenadas().some(c => norm(c) === norm(n))) return toast('Esa categoría ya existe', true);
  S.categorias = [...catsOrdenadas(), n];
  guardarCategorias();
}
function moverCat(cat, dir){
  const l = catsOrdenadas(); const i = l.indexOf(cat), j = i + dir;
  if(j < 0 || j >= l.length) return;
  [l[i], l[j]] = [l[j], l[i]];
  S.categorias = l; guardarCategorias();
}
function renombrarCat(cat){
  const n = (prompt('Nuevo nombre para la categoría:', cat) || '').trim();
  if(!n || n === cat) return;
  if(catsOrdenadas().some(c => c !== cat && norm(c) === norm(n))) return toast('Ya existe una categoría con ese nombre', true);
  S.categorias = catsOrdenadas().map(c => c === cat ? n : c);
  S.apps.forEach(a => { if(a.categoria === cat) a.categoria = n; });
  if(cerradas.delete(cat)){ cerradas.add(n); LS.set('cerradas', [...cerradas]); }
  guardar('renombrarCategoria', { anterior: cat, nueva: n });
}
function eliminarCat(cat){
  if(!confirm(`¿Eliminar la categoría “${cat}”?`)) return;
  S.categorias = catsOrdenadas().filter(c => c !== cat);
  guardarCategorias();
}

/* ---------- Editor de apps ---------- */
let editId = null, colorSel = COLORES[0];
function pintarColores(){
  $('#sw').innerHTML = COLORES.map(c => `<button type="button" data-c="${c}" style="background:${c}" class="${c.toLowerCase() === colorSel.toLowerCase() ? 'sel' : ''}"></button>`).join('')
    + `<input type="color" id="fColor" value="${colorSel}" title="Otro color">`;
}
function actualizarPrevia(){
  $('#pvIc').textContent = $('#fIcono').value.trim() || '📱';
  $('#pvIc').style.background = hexA(colorSel, .14);
  $('#pvNm').textContent = $('#fNombre').value.trim() || 'Nombre de la app';
  $('#pvDs').textContent = $('#fDesc').value.trim() || 'Descripción corta';
}
function abrirEditor(app){
  if(!S.admin) return pedirPin(() => abrirEditor(app));
  editId = app ? app.id : null;
  $('#dlgAppT').textContent = app ? 'Editar aplicación' : 'Agregar aplicación';
  $('#bEliminar').hidden = !app;
  $('#fNombre').value = app ? app.nombre : '';
  $('#fUrl').value = app ? app.url : '';
  $('#fDesc').value = app ? app.descripcion : '';
  $('#fIcono').value = app ? app.icono : '📱';
  colorSel = app ? app.color : COLORES[0];
  const cats = catsOrdenadas();
  if(!cats.length) cats.push(SIN_CAT);
  $('#fCat').innerHTML = cats.map(c => `<option>${esc(c)}</option>`).join('') + '<option value="__nueva">➕ Nueva categoría…</option>';
  $('#fCat').value = app ? app.categoria : cats[0];
  $('#fNuevaCat').value = '';
  $('#wNuevaCat').hidden = true;
  document.querySelector(`input[name=modo][value=${app && app.modo === 'pestana' ? 'pestana' : 'portal'}]`).checked = true;
  $('#fActiva').checked = app ? app.activa : true;
  pintarColores(); actualizarPrevia();
  $('#dlgApp').showModal();
  setTimeout(() => $('#fNombre').focus(), 50);
}

$('#fApp').addEventListener('submit', e => {
  e.preventDefault();
  const nombre = $('#fNombre').value.trim();
  const url = $('#fUrl').value.trim();
  let categoria = $('#fCat').value;
  if(categoria === '__nueva') categoria = $('#fNuevaCat').value.trim();
  if(!nombre) return toast('Falta el nombre', true);
  try{ const u = new URL(url); if(!/^https?:$/.test(u.protocol)) throw 0; }catch(_){ return toast('El link no es válido (debe empezar con https://)', true); }
  if(!categoria) return toast('Escribe el nombre de la nueva categoría', true);
  const existente = catsOrdenadas().find(c => norm(c) === norm(categoria));
  if(existente) categoria = existente;

  const datos = {
    nombre, url, categoria,
    descripcion: $('#fDesc').value.trim(),
    icono: $('#fIcono').value.trim() || '📱',
    color: colorOk(colorSel),
    modo: document.querySelector('input[name=modo]:checked').value,
    activa: $('#fActiva').checked
  };
  const maxOrden = Math.max(0, ...appsTodasDe(categoria).map(a => a.orden));
  let app;
  if(editId){
    app = getApp(editId);
    if(app.categoria !== categoria) datos.orden = maxOrden + 1;
    const urlCambio = app.url !== url;
    Object.assign(app, datos);
    const f = frame(app.id);
    if(f){
      if(app.modo === 'pestana') cerrarTab(app.id);
      else if(urlCambio){ f.dataset.ok = ''; f.src = url; }
    }
  }else{
    app = normApp({ ...datos, id: genId(), orden: maxOrden + 1 });
    S.apps.push(app);
  }
  if(!S.categorias.includes(categoria)) S.categorias = [...catsOrdenadas().filter(c => c !== categoria), categoria];
  $('#dlgApp').close();
  guardar('guardarApp', { app: JSON.stringify(app) });
});

$('#bCancelar').onclick = () => $('#dlgApp').close();
$('#bProbar').onclick = () => { const u = $('#fUrl').value.trim(); if(u) window.open(u, '_blank', 'noopener'); };
$('#bEliminar').onclick = () => {
  const app = getApp(editId); if(!app) return;
  if(!confirm(`¿Eliminar el botón “${app.nombre}”? La app en sí no se borra, solo el acceso desde el portal.`)) return;
  cerrarTab(app.id);
  S.apps = S.apps.filter(a => a.id !== app.id);
  $('#dlgApp').close();
  guardar('eliminarApp', { id: app.id });
};
$('#fCat').onchange = () => { $('#wNuevaCat').hidden = $('#fCat').value !== '__nueva'; if(!$('#wNuevaCat').hidden) $('#fNuevaCat').focus(); };
['fNombre', 'fIcono', 'fDesc'].forEach(id => $('#' + id).addEventListener('input', actualizarPrevia));
$('#picks').innerHTML = EMOJIS.map(e => `<button type="button">${e}</button>`).join('');
$('#picks').onclick = e => { const b = e.target.closest('button'); if(b){ $('#fIcono').value = b.textContent; actualizarPrevia(); } };
$('#sw').addEventListener('click', e => { const b = e.target.closest('button[data-c]'); if(b){ colorSel = b.dataset.c; pintarColores(); actualizarPrevia(); } });
$('#sw').addEventListener('input', e => { if(e.target.id === 'fColor'){ colorSel = e.target.value; document.querySelectorAll('#sw button').forEach(b => b.classList.remove('sel')); actualizarPrevia(); } });

/* ---------- PIN ---------- */
let trasPin = null;
function pedirPin(cb){
  trasPin = cb || null;
  $('#fPinIn').value = ''; $('#pinErr').textContent = '';
  $('#dlgPin').showModal();
  setTimeout(() => $('#fPinIn').focus(), 50);
}
$('#fPin').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#fPinIn').value.trim();
  if(v !== CONFIG.PIN){ $('#pinErr').textContent = 'PIN incorrecto'; $('#fPinIn').select(); return; }
  $('#dlgPin').close();
  setAdmin(true, v);
  toast('Modo configuración activado');
  if(trasPin){ const cb = trasPin; trasPin = null; cb(); }
});
$('#bPinCancelar').onclick = () => { trasPin = null; $('#dlgPin').close(); };
$('#navConfig').onclick = () => S.admin ? (setAdmin(false), toast('Saliste del modo configuración')) : pedirPin();

/* ---------- Usuario ---------- */
function pintarUsuario(){
  const u = LS.get('usuario', CONFIG.USUARIO_DEFECTO);
  $('#usrNombre').textContent = u.nombre || CONFIG.USUARIO_DEFECTO.nombre;
  $('#usrCargo').textContent = u.cargo || '';
  const ini = (u.nombre || 'PPS').split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();
  $('#avatar').textContent = ini || 'PPS';
}
$('#usuario').onclick = () => {
  const u = LS.get('usuario', CONFIG.USUARIO_DEFECTO);
  $('#fUsrNombre').value = u.nombre || ''; $('#fUsrCargo').value = u.cargo || '';
  $('#dlgUsr').showModal();
};
$('#fUsr').addEventListener('submit', e => {
  e.preventDefault();
  LS.set('usuario', { nombre: $('#fUsrNombre').value.trim() || CONFIG.USUARIO_DEFECTO.nombre, cargo: $('#fUsrCargo').value.trim() });
  $('#dlgUsr').close(); pintarUsuario();
});
$('#bUsrCancelar').onclick = () => $('#dlgUsr').close();

/* ---------- Eventos del menú ---------- */
const menu = $('#menu');
menu.addEventListener('click', e => {
  const catEl = e.target.closest('.cat'); const cat = catEl && catEl.dataset.cat;
  const b = e.target.closest('button');
  if(b){
    const it = b.closest('.item');
    if(b.hasAttribute('data-edit')) return abrirEditor(getApp(it.dataset.id));
    if(b.dataset.mov) return moverApp(it.dataset.id, +b.dataset.mov);
    if(b.dataset.cmov) return moverCat(cat, +b.dataset.cmov);
    if(b.hasAttribute('data-cren')) return renombrarCat(cat);
    if(b.hasAttribute('data-cdel')) return eliminarCat(cat);
    return;
  }
  const it = e.target.closest('.item');
  if(it) return abrirApp(it.dataset.id);
  if(e.target.closest('.cat-h')){
    cerradas.has(cat) ? cerradas.delete(cat) : cerradas.add(cat);
    LS.set('cerradas', [...cerradas]); renderMenu();
  }
});

// Arrastrar y soltar (modo configuración, computador)
let dragId = null;
const limpiarOver = () => menu.querySelectorAll('.over').forEach(x => x.classList.remove('over'));
menu.addEventListener('dragstart', e => {
  const it = e.target.closest('.item');
  if(!S.admin || !it) return;
  dragId = it.dataset.id; it.classList.add('drag');
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', dragId); }catch(_){}
});
menu.addEventListener('dragend', () => { menu.querySelectorAll('.drag').forEach(x => x.classList.remove('drag')); limpiarOver(); dragId = null; });
menu.addEventListener('dragover', e => {
  if(!dragId) return;
  const catEl = e.target.closest('.cat'); if(!catEl) return;
  e.preventDefault(); limpiarOver();
  const it = e.target.closest('.item');
  if(it && it.dataset.id !== dragId) it.classList.add('over');
  else if(!it) catEl.querySelector('.cat-b').classList.add('over');
});
menu.addEventListener('drop', e => {
  if(!dragId) return;
  const catEl = e.target.closest('.cat'); if(!catEl) return;
  e.preventDefault();
  const it = e.target.closest('.item');
  const id = dragId; dragId = null; limpiarOver();
  reubicar(id, catEl.dataset.cat, it && it.dataset.id !== id ? it.dataset.id : null);
});

/* ---------- Otros eventos ---------- */
$('#tabs').addEventListener('click', e => {
  const x = e.target.closest('[data-cerrar]');
  if(x) return cerrarTab(x.dataset.cerrar);
  const t = e.target.closest('.tab');
  if(t) activar(t.dataset.tab || null);
});
$('#tabs').addEventListener('auxclick', e => { const t = e.target.closest('.tab'); if(e.button === 1 && t && t.dataset.tab) cerrarTab(t.dataset.tab); });
$('#navInicio').onclick = () => { activar(null); cerrarDrawer(); };
$('#sideH').onclick = () => { if(innerWidth > 900) $('#aside').classList.toggle('plegado'); };
$('#btnNuevaApp').onclick = () => abrirEditor(null);
$('#btnNuevaCat').onclick = nuevaCategoria;
$('#estado').onclick = cargar;
$('#tRecargar').onclick = () => { const f = frame(S.activa); if(f){ f.dataset.ok = ''; cargando(true); f.src = getApp(S.activa).url; } };
$('#tExterna').onclick = () => { const a = getApp(S.activa); if(a) window.open(a.url, '_blank', 'noopener'); };
$('#tFull').onclick = () => { const v = $('#vistas'); (v.requestFullscreen || v.webkitRequestFullscreen || (() => {})).call(v); };
$('#tEditar').onclick = () => abrirEditor(getApp(S.activa));

const buscar = $('#buscar');
buscar.addEventListener('input', () => { S.filtro = buscar.value; renderMenu(); });
buscar.addEventListener('keydown', e => {
  if(e.key === 'Enter'){ const it = menu.querySelector('.item'); if(it){ abrirApp(it.dataset.id); buscar.value = ''; S.filtro = ''; renderMenu(); buscar.blur(); } }
  if(e.key === 'Escape'){ buscar.value = ''; S.filtro = ''; renderMenu(); buscar.blur(); }
});
document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    $('#aside').classList.remove('plegado');
    if(innerWidth <= 900) document.body.classList.add('drawer');
    buscar.focus(); buscar.select();
  }
});

function cerrarDrawer(){ document.body.classList.remove('drawer'); }
$('#burger').onclick = () => document.body.classList.toggle('drawer');
$('#velo').onclick = cerrarDrawer;

let toastT = null;
function toast(msg, err){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast on' + (err ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', 3200);
}

/* ---------- Inicio ---------- */
(function init(){
  const escudoGen = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path d="M32 4 L55 12 V30 C55 45 45 55 32 60 C19 55 9 45 9 30 V12 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/><rect x="23" y="29" width="18" height="15" rx="2" fill="#ffffff"/><path d="M26 29 v-4 a6 6 0 0 1 12 0 v4" fill="none" stroke="#ffffff" stroke-width="3.5"/><circle cx="32" cy="36" r="2.3" fill="#0058A3"/></svg>');
  $('#escudo').src = CONFIG.ESCUDO_PPS || escudoGen;
  if(CONFIG.LOGO_EMPRESA){
    $('#logoEmp').src = CONFIG.LOGO_EMPRESA; $('#logoEmp').hidden = false; $('#sepLogo').hidden = false;
    $('#logoPie').src = CONFIG.LOGO_EMPRESA; $('#logoPie').hidden = false;
  }
  if(CONFIG.BANNER) $('#banner').style.setProperty('--banner-img', `url("${CONFIG.BANNER}")`);
  $('#txtTitulo').textContent = CONFIG.TITULO;
  $('#txtSub').textContent = CONFIG.SUBTITULO;
  $('#txtBanner').innerHTML = CONFIG.BANNER_TITULO;
  $('#txtBannerSub').innerHTML = CONFIG.BANNER_TEXTO;
  $('#txtLema').textContent = CONFIG.LEMA;
  $('#txtPie').textContent = CONFIG.PIE;
  pintarUsuario();

  const cache = LS.get('datos', null);
  if(cache){ S.apps = (cache.apps || []).map(normApp); S.categorias = cache.categorias || []; marcarActualizado(cache.ts); }
  const pin = SS.get('pin');
  if(pin === CONFIG.PIN) setAdmin(true, pin);
  activar(null);
  renderTodo();
  cargar();
  setInterval(() => { if(!document.querySelector('dialog[open]') && !dragId) cargar(); }, 5 * 60 * 1000);
})();
</script>
</body>
